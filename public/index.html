<!DOCTYPE html>
<html>
<head>
    <title>Spend Limit Tracker</title>
    <!-- link the style sheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <div class="header">
            <h1>Spend Limit Tracker</h1>
            <p>Track Your Monthly Credit Card Spending</p>
        </div>

        <!-- Add a dropdown menu under the header. -->
         <div class = "menu">
            <!-- Dropdown menu for the application's features. -->
             <details id="appMenu">
                <!-- Clickable heading that opens and closes the menu. -->
                 <summary>Menu</summary>

                 <!-- Button that will eventually launch Plaid Link. -->
                  <button type="button" id="connectCardButton">
                    Connect Credit Card
                  </button>
             </details>
         </div>

        <div class="remaining-balance">
            <h2>Remaining Budget:</h2>
            <!-- Show the remaining budget -->
            <p id="budgetDisplay"></p>
        </div>

        <div class="history-controls">
            <!-- show charges button -->
            <button class="primary-button" id="toggleChargesButton">Show Charges</button>
            <ul id="chargesList"></ul>
        </div>

        <div class="charge-controls">
            <!-- <label for="chargeInput">Charge amount:</label> -->
            <input id="chargeInput" type="number" placeholder="Charge Amount">
            <button class="primary-button" id="addChargeButton">Add Charge</button>
        </div>

        <div class="budget-controls">
            <!-- <label for="budgetInput">Monthly budget:</label> -->
            <input id="budgetInput" type="number" placeholder="Monthly Budget">
            <button class="primary-button" id="setBudgetButton">Set Budget</button>
        </div>

        <div class="reset-controls">
            <!-- creates button for monthly reset -->
            <button id="resetMonthButton">Reset Month</button>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
